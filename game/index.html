<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spot the Difference — Moonlit Garden &amp; Lantern Market</title>
<style>
  :root {
    --ink: #f5e9c8;
    --panel: #1b2a4a;
    --accent: #ffd76a;
    --found: #ff4d4d;
    --muted: #9aa8c0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #10182a;
    color: var(--ink);
    font-family: "Trebuchet MS", Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    width: 1280px;
    max-width: 96vw;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 14px 4px 6px;
    gap: 12px;
  }
  h1 { font-size: 26px; margin: 0; letter-spacing: 1px; }
  h1 small { font-size: 14px; color: var(--muted); font-weight: normal; }
  .hud { display: flex; align-items: center; gap: 14px; font-size: 18px; }
  .hud .pill {
    background: #22304f;
    border: 1px solid #3a4a6a;
    border-radius: 999px;
    padding: 6px 14px;
    white-space: nowrap;
  }
  .hud .pill strong { color: var(--accent); }
  button {
    font: inherit;
    font-size: 16px;
    color: #10182a;
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 8px 16px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.45; cursor: default; }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid #3a4a6a; }
  main { width: 1280px; max-width: 96vw; }
  .boards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .board {
    background: var(--panel);
    border: 2px solid #3a4a6a;
    border-radius: 12px;
    padding: 8px;
    position: relative;
  }
  .board .tag {
    position: absolute;
    top: 14px;
    left: 16px;
    background: rgba(16, 24, 42, 0.75);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 14px;
    z-index: 2;
  }
  .board svg { display: block; width: 100%; height: auto; border-radius: 8px; }
  .board.shake { animation: shake 0.3s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
  .hit { cursor: pointer; fill: transparent; }
  .mark {
    fill: none;
    stroke: var(--found);
    stroke-width: 4;
    stroke-linecap: round;
    pointer-events: none;
  }
  .hint-ring {
    fill: none;
    stroke: var(--accent);
    stroke-width: 4;
    stroke-dasharray: 10 8;
    pointer-events: none;
    animation: pulse 0.8s ease-in-out infinite alternate;
  }
  @keyframes pulse { from { opacity: 0.4; } to { opacity: 1; } }
  footer {
    width: 1280px;
    max-width: 96vw;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 4px 18px;
    color: var(--muted);
    font-size: 15px;
  }
  .levels { display: flex; gap: 8px; }
  .levels span {
    border: 1px solid #3a4a6a;
    border-radius: 999px;
    padding: 4px 12px;
  }
  .levels span.done { background: #2d4a2b; color: var(--ink); border-color: #2d4a2b; }
  .levels span.now { background: var(--accent); color: #10182a; border-color: var(--accent); }
  #toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    background: #22304f;
    border: 1px solid #3a4a6a;
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 16px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 16, 30, 0.82);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #overlay.show { display: flex; }
  #overlay .card {
    background: #1b2a4a;
    border: 2px solid var(--accent);
    border-radius: 16px;
    padding: 28px 36px;
    text-align: center;
    max-width: 520px;
  }
  #overlay h2 { margin: 0 0 8px; font-size: 30px; }
  #overlay p { margin: 6px 0; font-size: 17px; color: var(--ink); }
  #overlay .stats { color: var(--muted); font-size: 15px; }
  #overlay button { margin-top: 14px; }
</style>
</head>
<body>
<header>
  <h1>Spot the Difference <small id="level-name">Level 1 · Moonlit Garden</small></h1>
  <div class="hud">
    <span class="pill">⏱ <strong id="timer">00:00</strong></span>
    <span class="pill">🔍 <strong id="remaining">7</strong> left</span>
    <button id="hint-btn" type="button">💡 Hint (3)</button>
    <button id="restart-btn" class="ghost" type="button">↺ Restart</button>
  </div>
</header>
<main>
  <div class="boards">
    <div class="board" id="board-a"><span class="tag">Picture A</span><svg id="svg-a" viewBox="0 0 640 460" role="img" aria-label="Picture A"></svg></div>
    <div class="board" id="board-b"><span class="tag">Picture B</span><svg id="svg-b" viewBox="0 0 640 460" role="img" aria-label="Picture B"></svg></div>
  </div>
</main>
<footer>
  <div class="levels"><span id="lvl-1" class="now">1 · Moonlit Garden</span><span id="lvl-2">2 · Lantern Market</span></div>
  <div>Click a difference in either picture · H for hint · R to restart</div>
</footer>
<div id="toast"></div>
<div id="overlay">
  <div class="card">
    <h2 id="overlay-title">You found them all!</h2>
    <p id="overlay-text"></p>
    <p class="stats" id="overlay-stats"></p>
    <button id="overlay-btn" type="button">Next level →</button>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
